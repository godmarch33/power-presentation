schema_version: "1.1"
name: no-trigger-vacation
description: Planning a vacation is not a product-video request; no present* skill may fire (negative case N1, golden set).
tags: [no-trigger, per-pr, mvp]
expected_outcome: Claude answers the travel question directly; no Skill call to present, present-edit, present-render or present-qa.
execution:
  prompt: |
    Help me plan a 10-day vacation in Portugal in October: which cities to visit, how many nights each,
    and a rough daily budget. No video, no slides - just a plain itinerary in text.
  max_turns: 5
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-present-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?present(?:-[\w-]+)?"'
    min: 0
    max: 0
    arm: both
